name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static validation
        run: ./scripts/validate.sh
      - name: Build pinned official-server wrapper
        run: docker build --pull --tag supermemory-local:ci .
